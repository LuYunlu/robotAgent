collection_name: agent
# ChromaDB 服务连接（Docker 容器运行，本机 rust 原生库崩溃不可用，故走 HTTP 服务）
host: localhost
port: 8000
k: 3
data_path: data
md5_hex_store: md5.txt
allow_knowledge_file_type: ["txt", "pdf", "csv"]

chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]