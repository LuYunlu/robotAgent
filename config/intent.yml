# 意图识别配置
collection_name: intent
# 余弦相似度阈值，低于该值判定为 unknown（无法识别），建议通过测试调优
similarity_threshold: 0.5

# 各意图的种子例句，新增意图或补充例句只需修改此处
seeds:
  report:
    - 生成我的使用报告
    - 查一下我的机器人使用记录
    - 给我看看上个月的清洁报告
    - 我这个月的使用情况怎么样
    - 生成月度使用统计
    - 我想看6月份的使用报告
    - 我的扫地机器人这个月用了多少次
    - 帮我出一份使用分析报告
    - 查询我的历史使用数据
    - 这个月耗材用了多少
  weather:
    - 今天天气怎么样
    - 北京现在下雨吗
    - 上海明天会下雨吗
    - 查询深圳的天气
    - 广州今天气温多少
    - 现在外面天气如何
    - 杭州的空气湿度是多少
    - 我这边的天气适合用扫拖机器人吗
  faq:
    - 扫地机器人不充电怎么办
    - 扫拖一体机和扫地机器人有什么区别
    - 机器人总是卡住怎么处理
    - 如何清理扫地机器人的滚刷
    - 滚刷缠绕头发怎么办
    - 怎么清理滚刷上的毛发
    - 小户型适合哪种扫地机器人
    - 扫地机器人噪音很大正常吗
    - 怎么设置定时清扫
    - 机器人迷路了怎么办
    - 拖布多久更换一次
    - 扫地机器人能清扫地毯吗
  chitchat:
    - 你好
    - 你好呀
    - 你好啊
    - 嗨
    - 在吗
    - 你是谁
    - 谢谢你的帮助
    - 你能做什么
    - 再见
    - 讲个笑话吧
    - 今天心情不错
    - 早上好
